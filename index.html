<body>
  <header id="header">
    <p class="eyebrow">Swertres · 3D</p>
    <h1 class="title">Swertres <span>Lucky</span> Numbers</h1>
    <p class="tagline">Tatlong numero, isang tapik. Good vibes lang.</p>
  </header>

  <main id="main">
    <form id="about-you" class="about" novalidate autocomplete="off">
      <div class="about-row">
        <label class="field"><span>Name <small>(optional)</small></span>
          <input id="name" name="name" type="text" maxlength="40" spellcheck="false"></label>
        <label class="field"><span>Age <small>(optional)</small></span>
          <input id="age" name="age" type="text" inputmode="numeric" maxlength="3"></label>
      </div>
      <fieldset class="games">
        <legend>Anong laro?</legend>
      <label><input type="radio" name="game" value="2d"><span>EZ2 (2D)</span></label>
      <label><input type="radio" name="game" value="3d" checked><span>Swertres (3D)</span></label>
      <label><input type="radio" name="game" value="4d"><span>4D Lotto</span></label>
      <label><input type="radio" name="game" value="6d"><span>6D Lotto</span></label>
      <label><input type="radio" name="game" value="6-42"><span>Lotto 6/42</span></label>
      <label><input type="radio" name="game" value="6-45"><span>Mega Lotto 6/45</span></label>
      <label><input type="radio" name="game" value="6-49"><span>Super Lotto 6/49</span></label>
      <label><input type="radio" name="game" value="6-55"><span>Grand Lotto 6/55</span></label>
      <label><input type="radio" name="game" value="6-58"><span>Ultra Lotto 6/58</span></label>
      </fieldset>
      <fieldset class="moods">
        <legend>Kumusta ka? <small>(required)</small></legend>
      <label><input type="radio" name="mood" value="masaya"><span>Masaya</span></label>
      <label><input type="radio" name="mood" value="pagod"><span>Pagod</span></label>
      <label><input type="radio" name="mood" value="stressed"><span>Stressed</span></label>
      <label><input type="radio" name="mood" value="kinikilig"><span>Kinikilig</span></label>
      <label><input type="radio" name="mood" value="chill"><span>Chill</span></label>
      <label><input type="radio" name="mood" value="ewan"><span>Ewan ko</span></label>
      </fieldset>
      <p id="form-status" aria-live="polite"></p>
    </form>

    <div class="balls">
      <div class="digit" id="digit-0"></div>
      <div class="digit" id="digit-1"></div>
      <div class="digit" id="digit-2"></div>
    </div>

    <p id="for-name" class="for-name" hidden></p>

    <ol class="reasons" hidden>
      <li>
        <span class="mini" id="mini-0"></span>
        <span class="reason" id="reason-0"></span>
      </li>
      <li>
        <span class="mini" id="mini-1"></span>
        <span class="reason" id="reason-1"></span>
      </li>
      <li>
        <span class="mini" id="mini-2"></span>
        <span class="reason" id="reason-2"></span>
      </li>
    </ol>

    <div id="combo-output" class="prompt">G ka na? Pindutin ang Bunot na!</div>

    <div class="segmented" id="mode-group" role="radiogroup">
      <label>
        <input type="radio" name="mode" value="straight" checked>
        <span>Straight</span>
      </label>
      <label>
        <input type="radio" name="mode" value="rambolito">
        <span>Rambolito</span>
      </label>
    </div>

    <div class="actions">
      <button id="draw">Bunot na!</button>
      <button id="share" disabled>I-share</button>
    </div>
    <p id="share-status" aria-live="polite"></p>
  </main>

  <aside id="ad-slot" class="ad-slot" hidden aria-label="Advertisement"></aside>

  <footer id="disclaimer">For entertainment only. Numbers are random and don't improve your odds. 18+. Play responsibly.</footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
