<body class="container">
  <header id="header">
    <h1 class="title">Swertres Lucky Numbers</h1>
  </header>

  <main id="main">
    <div id="combo-display">
      <div class="digit-container">
        <div class="digit" id="digit-0"></div>
        <div class="reason" id="reason-0"></div>
      </div>
      <div class="digit-container">
        <div class="digit" id="digit-1"></div>
        <div class="reason" id="reason-1"></div>
      </div>
      <div class="digit-container">
        <div class="digit" id="digit-2"></div>
        <div class="reason" id="reason-2"></div>
      </div>
    </div>

    <div id="combo-output">Pindutin ang Bunot na! para sa swerte mo</div>

    <div class="controls">
      <div class="mode-selector">
        <label>
          <input type="radio" name="mode" value="straight" checked> Straight
        </label>
        <label>
          <input type="radio" name="mode" value="rambolito"> Rambolito
        </label>
      </div>

      <button id="draw">Bunot na!</button>
      <button id="share" disabled>I-share</button>
    </div>
    <p id="share-status" aria-live="polite"></p>
  </main>

  <aside id="ad-slot" class="ad-slot" hidden aria-label="Advertisement"></aside>

  <footer id="disclaimer">For entertainment only. Numbers are random and don't improve your odds. 18+. Play responsibly.</footer>
